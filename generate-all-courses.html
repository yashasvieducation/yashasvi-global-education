<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate All Courses</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f8f9fa; }
  h1 { color: #1a73e8; }
  .btn { background: #1a73e8; color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px 0; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .log { background: #fff; border: 1px solid #e8eaed; border-radius: 8px; padding: 16px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; margin-top: 16px; }
  .success { color: #137333; }
  .error { color: #c5221f; }
  .info { color: #1a73e8; }
  .progress-bar { background: #e8eaed; border-radius: 100px; height: 10px; margin: 10px 0; }
  .progress-fill { background: #1a73e8; height: 10px; border-radius: 100px; transition: width 0.3s; }
  .stat { display: inline-block; margin: 8px 16px 8px 0; font-size: 15px; font-weight: 500; }
</style>
</head>
<body>
<h1>🤖 Generate All Course Content</h1>
<p>Generates AI content for all courses without modules. Each course ~20 seconds.</p>

<div>
  <span class="stat" id="statTotal">Loading...</span>
  <span class="stat" id="statDone" style="color:#137333;"></span>
  <span class="stat" id="statFail" style="color:#c5221f;"></span>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<button class="btn" id="genBtn" onclick="startGeneration()">🚀 Generate All Courses</button>
<button class="btn" style="background:#34a853; margin-left:10px;" onclick="loadCourses()">🔄 Refresh List</button>
<button class="btn" style="background:#f29900; margin-left:10px;" onclick="retryFailed()">🔁 Retry Failed</button>

<div class="log" id="log"></div>

<script>
const BASE = "https://fvjerthbdiaeomhjvcdg.supabase.co/rest/v1";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2amVydGhiZGlhZW9taGp2Y2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNjkxNTAsImV4cCI6MjA5Nzk0NTE1MH0._y4A3ipIew0GhsCqlc2Ox6p0lvW7X0nCSWEwfHUxEzE";
const HEADERS = { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json" };
const GROQ = "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";

let courses = [], done = 0, failed = 0;

function log(msg, type='info') {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = type;
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

async function loadCourses() {
  log('Loading courses without modules...', 'info');
  try {
    // Get all courses
    const cRes = await fetch(BASE + "/courses?select=id,name,department,level&is_active=eq.true", { headers: HEADERS });
    const allCourses = await cRes.json();

    // Get courses that have modules
    const mRes = await fetch(BASE + "/course_modules?select=course_id", { headers: HEADERS });
    const modules = await mRes.json();
    const withModules = new Set(modules.map(m => m.course_id));

    // Filter courses without modules
    courses = allCourses.filter(c => !withModules.has(c.id));

    document.getElementById('statTotal').textContent = `📚 ${courses.length} courses to generate`;
    document.getElementById('statDone').textContent = '';
    document.getElementById('statFail').textContent = '';
    log(`Found ${courses.length} courses needing content`, 'success');
    courses.forEach((c,i) => log(`  ${i+1}. ${c.name} (${c.level} · ${c.department})`, 'info'));
  } catch(e) {
    log('Error loading courses: ' + e.message, 'error');
  }
}

async function generateCourse(course) {
  log(`⚙️ Generating: ${course.name}...`, 'info');

  const prompt = `Generate a course for "${course.name}" (Level: ${course.level}, Dept: ${course.department}).
4 modules, 3 lessons each. Return ONLY compact JSON:
{"modules":[{"module_title":"Title","lessons":[{"title":"Title","content":"2 paragraphs of educational content.","duration":"15 min","project":"Assignment","mcq":[{"question":"Q?","options":["A","B","C","D"],"correct":"A"}]}]}]}
Keep content short but educational. Valid JSON only.`;

  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + GROQ, "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      max_tokens: 8000,
      temperature: 0.5,
      messages: [
        { role: "system", content: "You are a curriculum designer. Respond with valid compact JSON only. No markdown. No extra spaces. Keep content concise." },
        { role: "user", content: prompt }
      ]
    })
  });

  const data = await res.json();
  const text = data.choices?.[0]?.message?.content || '';
  const clean = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);

  // Save modules to Supabase
  for (let mi = 0; mi < parsed.modules.length; mi++) {
    const mod = parsed.modules[mi];
    await fetch(BASE + "/course_modules", {
      method: "POST",
      headers: { ...HEADERS, "Prefer": "return=representation" },
      body: JSON.stringify({
        course_id: course.id,
        module_index: mi,
        module_title: mod.module_title,
        lessons: mod.lessons
      })
    });
  }
  log(`✅ Done: ${course.name} — ${parsed.modules.length} modules saved`, 'success');
}

async function retryFailed() {
  await loadCourses();
  if (courses.length === 0) { log('No failed courses to retry!', 'success'); return; }
  log(`Retrying ${courses.length} courses...`, 'info');
  await startGeneration();
}

async function startGeneration() {
  if (courses.length === 0) { await loadCourses(); if (courses.length === 0) { log('No courses to generate!', 'error'); return; } }
  
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '⏳ Generating...';
  done = 0; failed = 0;

  for (let i = 0; i < courses.length; i++) {
    const course = courses[i];
    try {
      await generateCourse(course);
      done++;
    } catch(e) {
      log(`❌ Failed: ${course.name} — ${e.message}`, 'error');
      failed++;
    }
    // Update progress
    const pct = Math.round(((i+1) / courses.length) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('statDone').textContent = `✅ ${done} done`;
    document.getElementById('statFail').textContent = failed > 0 ? `❌ ${failed} failed` : '';

    // Wait between requests to avoid rate limit
    if (i < courses.length - 1) await new Promise(r => setTimeout(r, 3000));
  }

  btn.disabled = false; btn.textContent = '🚀 Generate All Courses';
  log(`\n🎉 Complete! ${done} generated, ${failed} failed.`, 'success');
}

// Auto load on page open
loadCourses();
</script>
</body>
</html>
