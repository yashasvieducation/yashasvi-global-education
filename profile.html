<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yashasvi Global Education — My Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', Arial, sans-serif; background: #f8f9fa; color: #202124; min-height: 100vh; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 64px; border-bottom: 1px solid #e8eaed; background: #fff; position: sticky; top: 0; z-index: 10; position: relative; }
  .nav-back { display: flex; align-items: center; gap: 8px; color: #1a73e8; font-size: 14px; text-decoration: none; font-family: 'Google Sans', Arial, sans-serif; font-weight: 500; padding: 8px 16px; border: 1.5px solid #1a73e8; border-radius: 4px; transition: all 0.15s; z-index: 1; }
  .nav-back:hover { background: #e8f0fe; }
  .nav > img { position: absolute; left: 50%; transform: translateX(-50%); }

  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px 60px; }

  /* Profile Header */
  .profile-header { background: #fff; border-radius: 12px; padding: 32px; margin-bottom: 20px; display: flex; align-items: center; gap: 24px; border: 1px solid #e8eaed; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #1a73e8, #34a853); display: flex; align-items: center; justify-content: center; font-family: 'Google Sans', Arial, sans-serif; font-size: 32px; font-weight: 500; color: #fff; flex-shrink: 0; }
  .profile-info { flex: 1; }
  .profile-name { font-family: 'Google Sans', Arial, sans-serif; font-size: 26px; font-weight: 400; color: #202124; margin-bottom: 4px; }
  .profile-email { font-size: 14px; color: #5f6368; margin-bottom: 8px; }
  .profile-badges-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .profile-tag { display: inline-flex; align-items: center; gap: 4px; background: #e8f0fe; color: #1a73e8; border-radius: 100px; padding: 4px 12px; font-size: 12px; font-weight: 500; }
  .edit-btn { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 10px 20px; font-size: 14px; font-family: 'Google Sans', Arial, sans-serif; font-weight: 500; cursor: pointer; flex-shrink: 0; }
  .edit-btn:hover { background: #1765cc; }

  /* Stats Grid */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr 1fr; } .profile-header { flex-direction: column; text-align: center; } }
  .stat-card { background: #fff; border: 1px solid #e8eaed; border-radius: 10px; padding: 18px; text-align: center; }
  .stat-icon { font-size: 24px; margin-bottom: 6px; }
  .stat-num { font-family: 'Google Sans', Arial, sans-serif; font-size: 26px; font-weight: 400; color: #1a73e8; }
  .stat-label { font-size: 12px; color: #5f6368; margin-top: 2px; }

  /* Cards */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #e8eaed; border-radius: 10px; padding: 22px; }
  .card-title { font-family: 'Google Sans', Arial, sans-serif; font-size: 15px; font-weight: 500; color: #202124; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .info-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f3f4; }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 13px; color: #5f6368; }
  .info-value { font-size: 14px; color: #202124; font-weight: 500; }
  .info-input { border: 1px solid #dadce0; border-radius: 4px; padding: 8px 12px; font-size: 14px; font-family: 'Roboto', Arial, sans-serif; outline: none; width: 60%; }
  .info-input:focus { border-color: #1a73e8; }

  /* Badges */
  .badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge-item { border: 1px solid #e8eaed; border-radius: 8px; padding: 14px 10px; text-align: center; }
  .badge-item.earned { border-color: #34a853; background: #e6f4ea; }
  .badge-item.locked { opacity: 0.4; }
  .badge-emoji { font-size: 24px; margin-bottom: 4px; }
  .badge-name { font-size: 11px; font-weight: 500; color: #5f6368; }
  .badge-item.earned .badge-name { color: #137333; }

  /* Password */
  .pass-field { margin-bottom: 12px; }
  .pass-field label { display: block; font-size: 13px; color: #5f6368; margin-bottom: 4px; }
  .pass-wrap { position: relative; }
  .pass-input { width: 100%; padding: 10px 40px 10px 12px; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; font-family: 'Roboto', Arial, sans-serif; outline: none; }
  .pass-input:focus { border-color: #1a73e8; }
  .pass-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #5f6368; }
  .save-btn { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 10px 24px; font-size: 14px; font-family: 'Google Sans', Arial, sans-serif; font-weight: 500; cursor: pointer; width: 100%; margin-top: 4px; }
  .save-btn:hover { background: #1765cc; }
  .save-btn:disabled { background: #dadce0; color: #80868b; cursor: not-allowed; }

  /* Course Progress */
  .progress-bg { background: #f1f3f4; border-radius: 100px; height: 8px; margin: 8px 0 4px; }
  .progress-fill { background: #1a73e8; height: 8px; border-radius: 100px; transition: width 0.4s; }

  /* Cert */
  .cert-box { background: linear-gradient(135deg, #1a3a5c, #1a73e8); border-radius: 8px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .cert-box .cert-icon { font-size: 28px; }
  .cert-box .cert-info { flex: 1; }
  .cert-box .cert-title { font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .cert-box .cert-id { font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.8); }
  .cert-btn { background: #fff; color: #1a73e8; border: none; border-radius: 4px; padding: 8px 16px; font-size: 13px; font-family: 'Google Sans', Arial, sans-serif; font-weight: 500; cursor: pointer; flex-shrink: 0; }

  .msg { padding: 10px 14px; border-radius: 4px; font-size: 13px; margin-top: 10px; display: none; }
  .msg-success { background: #e6f4ea; color: #137333; display: block !important; }
  .msg-error { background: #fce8e6; color: #c5221f; display: block !important; }

  .loading { text-align: center; padding: 60px; color: #5f6368; }
  .spin { font-size: 28px; animation: spin 1s linear infinite; display: block; margin-bottom: 10px; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ===== GLOBAL MOBILE RESPONSIVE ===== */
  @media (max-width: 768px) {
    .nav { padding: 0 14px !important; height: 56px !important; }
    .hero-banner { padding: 24px 20px !important; flex-direction: column !important; gap: 16px !important; text-align: center; }
    .hero-text h2 { font-size: 20px !important; }
    .hero-emoji { font-size: 48px !important; }
    .hero-btns { justify-content: center; }
    .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
    .main-grid { grid-template-columns: 1fr !important; }
    .quick-grid { grid-template-columns: 1fr 1fr !important; }
    .grid-2 { grid-template-columns: 1fr !important; }
    .layout { grid-template-columns: 1fr !important; }
    .sidebar { display: none !important; }
    .chat-panel { display: none !important; }
    .field-row { grid-template-columns: 1fr !important; }
    .plans-grid { grid-template-columns: 1fr !important; }
    .type-grid { grid-template-columns: 1fr !important; }
    .difficulty-grid { grid-template-columns: 1fr !important; }
    .score-grid { grid-template-columns: 1fr !important; }
    .exam-info-grid { grid-template-columns: 1fr !important; }
    .form-row { grid-template-columns: 1fr !important; }
    .badges-grid { grid-template-columns: repeat(3, 1fr) !important; }
    .notes-grid { grid-template-columns: 1fr !important; }
    .courses-grid { grid-template-columns: 1fr !important; }
    .cert-actions { flex-direction: column !important; }
    .profile-header { flex-direction: column !important; align-items: center !important; text-align: center !important; }
    .my-course-card { flex-direction: column !important; }
    .renewal-section { flex-direction: column !important; }
    .wrap, .form-wrap { padding-left: 16px !important; padding-right: 16px !important; }
    #dashWrap { padding: 16px 14px 40px !important; }
    .hero { padding: 28px 16px 20px !important; }
    .hero h1 { font-size: 24px !important; }
    table { font-size: 12px !important; display: block; overflow-x: auto; }
    .card { padding: 16px !important; }
    .stat-num { font-size: 22px !important; }
    .btn-hero, .btn-hero-outline { padding: 9px 16px !important; font-size: 13px !important; }
    #loginWrap { padding: 24px 20px !important; margin: 20px auto !important; }
    .quick-link { padding: 11px 12px !important; font-size: 13px !important; }
  }
  @media (max-width: 480px) {
    .hero-text h2 { font-size: 18px !important; }
    .stat-num { font-size: 20px !important; }
    .hero-btns { flex-direction: column !important; align-items: stretch !important; }
  }
  /* ===== END MOBILE ===== */


  /* Mobile App UI */
  .mobile-top-bar { display: none; position: sticky; top: 0; z-index: 200; background: #fff; border-bottom: 1px solid #e8eaed; padding: 10px 20px; text-align: center; }
  .mobile-bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e8eaed; z-index: 999; padding: 8px 0 12px; box-shadow: 0 -4px 16px rgba(0,0,0,0.08); }
  .mobile-bottom-nav .bnav-items { display: flex; justify-content: space-around; align-items: center; }
  .bnav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5f6368; font-size: 10px; font-family: 'Google Sans', Arial, sans-serif; padding: 4px 8px; min-width: 52px; }
  .bnav-item .bi { font-size: 22px; line-height: 1; }
  .bnav-item.active { color: #1a73e8; }
  .bnav-center { background: #1a73e8; color: #fff !important; border-radius: 50%; width: 54px; height: 54px; margin-top: -18px; box-shadow: 0 4px 16px rgba(26,115,232,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; text-decoration: none; }
  .bnav-center .bi { font-size: 22px; }
  @media (max-width: 768px) {
    .mobile-top-bar { display: block; }
    .mobile-bottom-nav { display: block; }
    .nav { display: none !important; }
    body { padding-bottom: 80px; }
  }
</style>
</head>
<body>
<!-- Mobile Top Bar -->
<div class="mobile-top-bar"><a href="/"><img src="/logo.svg" alt="YGE" style="height:34px;"></a></div>
<!-- Mobile Bottom Nav -->
<div class="mobile-bottom-nav">
  <div class="bnav-items">
    <a class="bnav-item" href="/dashboard.html"><span class="bi">🏠</span><span>Home</span></a>
    <a class="bnav-item" href="/my-courses.html"><span class="bi">📚</span><span>Courses</span></a>
    <a class="bnav-center" href="/syllabus.html"><span class="bi">📖</span><span>Study</span></a>
    <a class="bnav-item" href="/profile.html"><span class="bi">👤</span><span>Profile</span></a>
    <a class="bnav-item" href="/certification.html"><span class="bi">🎓</span><span>Cert</span></a>
  </div>
</div>


<nav class="nav">
  <a class="nav-back" id="backBtn" href="/dashboard.html">← Back</a>
  <img src="/logo.svg" alt="YGE" style="height:36px;">
  <div style="width:120px;"></div>
</nav>

<div class="wrap" id="mainWrap">
  <div class="loading"><span class="spin">⏳</span>Loading profile…</div>
</div>

<script>
const BASE = "https://fvjerthbdiaeomhjvcdg.supabase.co/rest/v1";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2amVydGhiZGlhZW9taGp2Y2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNjkxNTAsImV4cCI6MjA5Nzk0NTE1MH0._y4A3ipIew0GhsCqlc2Ox6p0lvW7X0nCSWEwfHUxEzE";
const HEADERS = { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json" };

const urlParams = new URLSearchParams(window.location.search);
const email = urlParams.get('email') || localStorage.getItem('yge_email') || '';
if (email) document.getElementById('backBtn').href = '/dashboard.html?email=' + encodeURIComponent(email);

const BADGES = [
  { emoji: '🌱', name: 'First Step', req: 1 },
  { emoji: '⚡', name: 'On a Roll', req: 5 },
  { emoji: '🔥', name: 'Unstoppable', req: 10 },
  { emoji: '📖', name: 'Module Done', req: 'module' },
  { emoji: '🎯', name: 'Halfway', req: 50 },
  { emoji: '🏆', name: 'Complete', req: 100 },
];

let studentData = {}, editMode = false;

async function loadProfile() {
  if (!email) { document.getElementById('mainWrap').innerHTML = '<div class="loading">Please login first. <a href="/login.html" style="color:#1a73e8;">Login →</a></div>'; return; }

  try {
    const [sRes, pRes] = await Promise.all([
      fetch(BASE + "/students?select=*&student_email=ilike." + encodeURIComponent(email), { method: "GET", headers: HEADERS }),
      fetch(BASE + "/syllabus_progress?select=completed_lessons,total_lessons&student_email=ilike." + encodeURIComponent(email), { method: "GET", headers: HEADERS })
    ]);
    const sData = await sRes.json();
    const pData = await pRes.json();
    if (!Array.isArray(sData) || sData.length === 0) { document.getElementById('mainWrap').innerHTML = '<div class="loading">No account found. <a href="/login.html" style="color:#1a73e8;">Login →</a></div>'; return; }

    studentData = sData[0];
    const progress = pData[0] || {};
    const completed = Array.isArray(progress.completed_lessons) ? progress.completed_lessons.length : 0;
    const total = progress.total_lessons || 12;
    const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
    const initials = (studentData.student_name || 'S').split(' ').map(w => w[0]).join('').toUpperCase().substring(0, 2);

    // Badge calc
    const earnedBadges = BADGES.filter(b => {
      if (typeof b.req === 'number' && b.req <= 10) return completed >= b.req;
      if (b.req === 50) return pct >= 50;
      if (b.req === 100) return pct >= 100;
      return false;
    }).length;

    document.getElementById('mainWrap').innerHTML = `
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="avatar">${initials}</div>
        <div class="profile-info">
          <div class="profile-name" id="displayName">${studentData.student_name || '—'}</div>
          <div class="profile-email">${email}</div>
          <div class="profile-badges-row">
            <span class="profile-tag">📚 ${studentData.selected_course || 'No course'}</span>
            <span class="profile-tag">🌍 ${studentData.country || 'India'}</span>
            <span class="profile-tag">${studentData.admission_status === 'certified' ? '🎓 Certified' : '🎓 Student'}</span>
          </div>
        </div>
        <button class="edit-btn" onclick="toggleEdit()">✏️ Edit Profile</button>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">📚</div><div class="stat-num">${completed}</div><div class="stat-label">Lessons done</div></div>
        <div class="stat-card"><div class="stat-icon">⏱</div><div class="stat-num">${pct}%</div><div class="stat-label">Progress</div></div>
        <div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-num">${earnedBadges}</div><div class="stat-label">Badges earned</div></div>
        <div class="stat-card"><div class="stat-icon">📝</div><div class="stat-num">${studentData.exam_score ? Math.round(studentData.exam_score) + '%' : '—'}</div><div class="stat-label">Exam score</div></div>
      </div>

      <div class="grid-2">
        <!-- Personal Info -->
        <div class="card">
          <div class="card-title">👤 Personal Information</div>
          <div id="infoSection">
            <div class="info-row"><span class="info-label">Full Name</span><span class="info-value">${studentData.student_name || '—'}</span></div>
            <div class="info-row"><span class="info-label">Email</span><span class="info-value" style="font-size:13px;">${email}</span></div>
            <div class="info-row"><span class="info-label">Country</span><span class="info-value">${studentData.country || '—'}</span></div>
            <div class="info-row"><span class="info-label">Address</span><span class="info-value">${studentData.address || '—'}</span></div>
            <div class="info-row"><span class="info-label">Course</span><span class="info-value" style="font-size:12px;">${studentData.selected_course || '—'}</span></div>
            <div class="info-row"><span class="info-label">Status</span><span class="info-value" style="color:#137333;">${studentData.admission_status || 'pending'}</span></div>
          </div>
          <div id="editSection" style="display:none;">
            <div class="pass-field"><label>Full Name</label><input class="pass-input" id="editName" value="${studentData.student_name || ''}"></div>
            <div class="pass-field"><label>Address</label><input class="pass-input" id="editAddress" value="${studentData.address || ''}"></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="save-btn" onclick="saveProfile()">Save Changes</button>
              <button onclick="toggleEdit()" style="flex:1; background:#f1f3f4; color:#202124; border:none; border-radius:4px; padding:10px; font-size:14px; cursor:pointer;">Cancel</button>
            </div>
            <div class="msg" id="editMsg"></div>
          </div>
        </div>

        <!-- Course Progress -->
        <div class="card">
          <div class="card-title">📖 Course Progress</div>
          <div style="font-size:14px; font-weight:500; color:#202124; margin-bottom:8px;">${studentData.selected_course || '—'}</div>
          <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div style="display:flex; justify-content:space-between; font-size:12px; color:#5f6368; margin-bottom:16px;"><span>${completed} of ${total} lessons</span><span>${pct}%</span></div>
          <div style="font-size:13px; color:#5f6368; margin-bottom:16px;">⏱ ${(total - completed) * 15} min remaining</div>
          ${studentData.cert_id ? `
          <div class="cert-box">
            <div class="cert-icon">🎓</div>
            <div class="cert-info">
              <div class="cert-title">Certificate Earned!</div>
              <div class="cert-id">${studentData.cert_id}</div>
            </div>
            <button class="cert-btn" onclick="window.location.href='/certification.html?email=${encodeURIComponent(email)}'">View →</button>
          </div>` : `<div style="background:#f8f9fa; border-radius:8px; padding:14px; text-align:center; font-size:13px; color:#5f6368;">Complete the course to earn your certificate 🎓</div>`}
        </div>
      </div>

      <!-- Badges + Password -->
      <div class="grid-2">
        <div class="card">
          <div class="card-title">🏆 My Badges</div>
          <div class="badges-grid">
            ${BADGES.map((b, i) => {
              let earned = false;
              if (typeof b.req === 'number' && b.req <= 10) earned = completed >= b.req;
              else if (b.req === 50) earned = pct >= 50;
              else if (b.req === 100) earned = pct >= 100;
              return `<div class="badge-item ${earned ? 'earned' : 'locked'}">
                <div class="badge-emoji">${b.emoji}</div>
                <div class="badge-name">${b.name}</div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-title">🔐 Change Password</div>
          <div class="pass-field">
            <label>Current Password</label>
            <div class="pass-wrap">
              <input class="pass-input" type="password" id="currPass" placeholder="Current password" autocomplete="new-password">
              <button class="pass-eye" type="button" onclick="togglePassVis('currPass', this)">👁</button>
            </div>
          </div>
          <div class="pass-field">
            <label>New Password</label>
            <div class="pass-wrap">
              <input class="pass-input" type="password" id="newPass" placeholder="Min 8 characters" autocomplete="new-password">
              <button class="pass-eye" type="button" onclick="togglePassVis('newPass', this)">👁</button>
            </div>
          </div>
          <div class="pass-field">
            <label>Confirm New Password</label>
            <div class="pass-wrap">
              <input class="pass-input" type="password" id="confPass" placeholder="Re-enter new password" autocomplete="new-password">
              <button class="pass-eye" type="button" onclick="togglePassVis('confPass', this)">👁</button>
            </div>
          </div>
          <button class="save-btn" onclick="changePassword()">Update Password</button>
          <div class="msg" id="passMsg"></div>
        </div>
      </div>`;

  } catch(e) { document.getElementById('mainWrap').innerHTML = '<div class="loading">Error: ' + e.message + '</div>'; }
}

function toggleEdit() {
  editMode = !editMode;
  document.getElementById('infoSection').style.display = editMode ? 'none' : 'block';
  document.getElementById('editSection').style.display = editMode ? 'block' : 'none';
  document.querySelector('.edit-btn').textContent = editMode ? '✕ Cancel Edit' : '✏️ Edit Profile';
}

async function saveProfile() {
  const name = document.getElementById('editName').value.trim();
  const address = document.getElementById('editAddress').value.trim();
  if (!name) { showMsg('editMsg', 'error', 'Name cannot be empty.'); return; }
  const btn = document.querySelector('#editSection .save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await fetch(BASE + "/students?student_email=ilike." + encodeURIComponent(email), {
      method: "PATCH", headers: { ...HEADERS, "Prefer": "return=representation" },
      body: JSON.stringify({ student_name: name, address })
    });
    showMsg('editMsg', 'success', '✅ Profile updated!');
    document.getElementById('displayName').textContent = name;
    btn.disabled = false; btn.textContent = 'Save Changes';
    setTimeout(() => toggleEdit(), 1500);
  } catch(e) { showMsg('editMsg', 'error', 'Error: ' + e.message); btn.disabled = false; btn.textContent = 'Save Changes'; }
}

async function changePassword() {
  const curr = document.getElementById('currPass').value;
  const newP = document.getElementById('newPass').value;
  const conf = document.getElementById('confPass').value;
  if (!curr || !newP || !conf) { showMsg('passMsg', 'error', 'Please fill all fields.'); return; }
  if (newP !== conf) { showMsg('passMsg', 'error', 'New passwords do not match.'); return; }
  if (newP.length < 8) { showMsg('passMsg', 'error', 'Password must be at least 8 characters.'); return; }
  if (curr !== studentData.password) { showMsg('passMsg', 'error', 'Current password is incorrect.'); return; }
  const btn = document.querySelector('#passMsg').previousElementSibling;
  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    await fetch(BASE + "/students?student_email=ilike." + encodeURIComponent(email), {
      method: "PATCH", headers: { ...HEADERS, "Prefer": "return=representation" },
      body: JSON.stringify({ password: newP })
    });
    studentData.password = newP;
    showMsg('passMsg', 'success', '✅ Password updated successfully!');
    document.getElementById('currPass').value = '';
    document.getElementById('newPass').value = '';
    document.getElementById('confPass').value = '';
    btn.disabled = false; btn.textContent = 'Update Password';
  } catch(e) { showMsg('passMsg', 'error', 'Error: ' + e.message); btn.disabled = false; btn.textContent = 'Update Password'; }
}

function togglePassVis(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

function showMsg(id, type, text) {
  const m = document.getElementById(id);
  m.className = 'msg msg-' + type; m.textContent = text; m.style.display = 'block';
  if (type === 'success') setTimeout(() => m.style.display = 'none', 3000);
}

loadProfile();
</script>
